<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }
        .overlay button {
            padding: 15px 30px;
            font-size: 20px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .card {
            display: none;
            animation: fadeIn 1s ease forwards;
        }
        h1 { color: #ff4757; font-size: 3rem; margin-bottom: 10px; }
        p { color: #333; font-size: 1.5rem; }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>

    <!-- The overlay button handles browser restrictions and starts the music -->
    <div class="overlay" id="overlay">
        <button onclick="startCelebration()">🎁 Open Birthday Card</button>
    </div>

    <div class="card" id="card">
        <h1>🎉 Happy Birthday! 🎉</h1>
        <p>Wishing you the happiest day ever! 🎂✨</p>
    </div>

    <!-- Replace the URL inside src with your own direct MP3 music link -->
   <audio id="birthdaySong" preload="auto" loop>
        <source src="https://files.catbox.moe/px9qxt.mp3" type="audio/mpeg">
    </audio>

    <script>
        function startCelebration() {
            // Hide the overlay button
            document.getElementById('overlay').style.display = 'none';
            // Show the birthday card
            document.getElementById('card').style.display = 'block';
            // Play the music automatically
            document.getElementById('birthdaySong').play();
        }
    </script>
</body>
</html>
